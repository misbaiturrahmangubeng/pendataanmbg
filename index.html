<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendataan MBG - MIS Baiturrahman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 untuk Notifikasi -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen pb-12">

    <!-- Header Section -->
    <div class="bg-emerald-700 text-white pt-10 pb-16 px-4 rounded-b-[3rem] shadow-lg text-center">
        <!-- Logo dari GDrive -->
        <img src="https://drive.google.com/uc?export=view&id=18e1v76BALeQYgi3J4cvN5KE94tdBcR4W" alt="Logo MIS Baiturrahman" class="h-24 w-auto mx-auto mb-4 bg-white p-2 rounded-full shadow-md object-contain">
        
        <h1 class="text-2xl font-bold mb-1">Pendataan Penerima Manfaat</h1>
        <h2 class="text-lg font-semibold text-emerald-200">Makanan Bergizi Gratis (MBG)</h2>
        <p class="text-sm mt-3 font-light italic">"Care, Creative and Islamic Generation"</p>
    </div>

    <!-- Main Form Container -->
    <div class="max-w-2xl mx-auto -mt-8 px-4">
        <div class="bg-white rounded-xl shadow-xl p-6 md:p-8">
            
            <!-- Toggle Form Tipe -->
            <div class="flex justify-center mb-8 bg-gray-100 p-1 rounded-lg">
                <button id="btn-siswa" onclick="setFormType('siswa')" class="w-1/2 py-2 px-4 rounded-md font-semibold text-emerald-800 bg-white shadow transition-all">Data Siswa</button>
                <button id="btn-guru" onclick="setFormType('guru')" class="w-1/2 py-2 px-4 rounded-md font-semibold text-gray-500 hover:text-emerald-700 transition-all">Data Guru/Non Guru</button>
            </div>

            <!-- Form -->
            <form id="mbg-form" class="space-y-5">
                <input type="hidden" name="tipe_form" id="tipe_form" value="siswa">

                <!-- Header Info (Sekolah & PIC) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Sekolah</label>
                        <input type="text" name="nama_sekolah" value="MIS Baiturrahman Gubeng" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500 bg-gray-50" readonly required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">No HP/WA PIC</label>
                        <input type="tel" name="pic_hp" placeholder="Contoh: 08123456789" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                    </div>
                </div>

                <hr class="my-4 border-gray-200">

                <!-- Data Personal -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="nama" placeholder="Masukkan nama lengkap" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin</label>
                        <select name="jk" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                            <option value="">-- Pilih --</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
                        <input type="date" name="tanggal_lahir" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                    </div>
                </div>

                <!-- Kolom Spesifik Siswa / Guru -->
                <div id="field-identitas-siswa" class="block">
                    <label class="block text-sm font-medium text-gray-700 mb-1">NISN / NIK</label>
                    <input type="text" name="nisn_nik" id="nisn_nik" placeholder="Masukkan NISN atau NIK" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                </div>

                <div id="field-identitas-guru" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">NIP / NIK</label>
                    <input type="text" name="nip_nik" id="nip_nik" placeholder="Masukkan NIP atau NIK" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                </div>

                <div id="field-ortu" class="block">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Orang Tua</label>
                    <input type="text" name="nama_ortu" id="nama_ortu" placeholder="Masukkan nama ayah/ibu" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                </div>

                <!-- Alamat & Alergi -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap</label>
                    <textarea name="alamat" rows="2" placeholder="Masukkan alamat lengkap" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Riwayat Alergi (Makanan/Obat)</label>
                    <input type="text" name="alergi" placeholder="Isi 'Tidak ada' jika tidak memiliki alergi" class="w-full px-4 py-2 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors mt-6">
                    Kirim Data
                </button>
            </form>
        </div>
        
        <div class="text-center mt-6 text-gray-500 text-sm">
            &copy; 2026 MIS Baiturrahman Gubeng
        </div>
    </div>

    <!-- Logika Interaksi UI dan Pengiriman Data -->
    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz6IIKkRBtZRZUx-kUpTDaHVJWtXNRLVWuVVrlhVmIoAoWzBBMWlN_5OvJmLtOoPqNB/exec'; 

        const form = document.getElementById('mbg-form');
        const tipeFormInput = document.getElementById('tipe_form');
        
        // Element Fields
        const fieldIdentitasSiswa = document.getElementById('field-identitas-siswa');
        const fieldIdentitasGuru = document.getElementById('field-identitas-guru');
        const fieldOrtu = document.getElementById('field-ortu');
        
        // Inputs
        const inputNisn = document.getElementById('nisn_nik');
        const inputNip = document.getElementById('nip_nik');
        const inputOrtu = document.getElementById('nama_ortu');

        // Buttons
        const btnSiswa = document.getElementById('btn-siswa');
        const btnGuru = document.getElementById('btn-guru');

        function setFormType(type) {
            tipeFormInput.value = type;
            
            if (type === 'siswa') {
                // Styling Button
                btnSiswa.className = "w-1/2 py-2 px-4 rounded-md font-semibold text-emerald-800 bg-white shadow transition-all";
                btnGuru.className = "w-1/2 py-2 px-4 rounded-md font-semibold text-gray-500 hover:text-emerald-700 transition-all";
                
                // Show/Hide Fields
                fieldIdentitasSiswa.classList.remove('hidden');
                fieldOrtu.classList.remove('hidden');
                fieldIdentitasGuru.classList.add('hidden');
                
                // Toggle Required Attributes
                inputNisn.required = true;
                inputOrtu.required = true;
                inputNip.required = false;
                
            } else {
                // Styling Button
                btnGuru.className = "w-1/2 py-2 px-4 rounded-md font-semibold text-emerald-800 bg-white shadow transition-all";
                btnSiswa.className = "w-1/2 py-2 px-4 rounded-md font-semibold text-gray-500 hover:text-emerald-700 transition-all";
                
                // Show/Hide Fields
                fieldIdentitasSiswa.classList.add('hidden');
                fieldOrtu.classList.add('hidden');
                fieldIdentitasGuru.classList.remove('hidden');
                
                // Toggle Required Attributes
                inputNip.required = true;
                inputNisn.required = false;
                inputOrtu.required = false;
            }
        }

        // Handle Submit
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            Swal.fire({
                title: 'Menyimpan Data...',
                text: 'Mohon tunggu sebentar',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading()
                }
            });

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => response.json())
                .then(data => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Data pendataan MBG telah tersimpan.',
                        confirmButtonColor: '#059669'
                    });
                    form.reset();
                    // Kembalikan nama sekolah ke default
                    document.querySelector('input[name="nama_sekolah"]').value = "MIS Baiturrahman Gubeng";
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Terjadi kesalahan sistem, data gagal dikirim!',
                        confirmButtonColor: '#ef4444'
                    });
                    console.error('Error!', error.message)
                });
        });
    </script>
</body>
</html>
